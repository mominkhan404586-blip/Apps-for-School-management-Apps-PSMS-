name: Build & Deploy Web App and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-web:
    name: Verify & Build Web App (school-management-nexus-bd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npx --yes tsx --test src/utils/*.test.ts

      - name: Build Responsive Web App
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LIVE_WEB_APP_URL: ${{ vars.VITE_LIVE_WEB_APP_URL }}
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psms-web-dist
          path: dist

  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages (optional)
    runs-on: ubuntu-latest
    needs: verify-and-build-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: psms-web-dist
          path: dist

      - name: Deploy to Cloudflare Pages (when credentials are configured)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=school-management-nexus-bd

      - name: Skip Cloudflare deployment when credentials are not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare deployment skipped because its GitHub Actions secrets are not configured."

  build-android-apk:
    name: Build Android APK (Unified Backend & DB)
    runs-on: ubuntu-latest
    needs: verify-and-build-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Sync Web Bundle to Capacitor Android Project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LIVE_WEB_APP_URL: ${{ vars.VITE_LIVE_WEB_APP_URL }}
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run android:sync

      - name: Build Android Debug APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psms-android-apk
          path: android/app/build/outputs/apk/**/*.apk
