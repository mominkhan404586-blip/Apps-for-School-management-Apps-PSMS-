name: Build & Deploy Web App and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-web:
    name: Verify & Build Web App (PSMS Bangladesh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: TypeScript Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npx --yes tsx --test src/utils/*.test.ts

      - name: Build Responsive Web App
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://school-management-system-sms-798667902569.asia-southeast1.run.app' }}
          VITE_LIVE_WEB_APP_URL: ${{ vars.VITE_LIVE_WEB_APP_URL || 'https://school-management-system-sms-798667902569.asia-southeast1.run.app' }}
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v6
        with:
          name: psms-web-dist
          path: dist
          if-no-files-found: error

  build-android-apk:
    name: Build Android APK (Unified Backend & DB)
    runs-on: ubuntu-latest
    needs: verify-and-build-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Sync Web Bundle to Capacitor Android Project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://school-management-system-sms-798667902569.asia-southeast1.run.app' }}
          VITE_LIVE_WEB_APP_URL: ${{ vars.VITE_LIVE_WEB_APP_URL || 'https://school-management-system-sms-798667902569.asia-southeast1.run.app' }}
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run android:sync

      - name: Build Android Debug APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: psms-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
